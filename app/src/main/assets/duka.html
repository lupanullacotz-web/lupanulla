<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duka | Lupanulla</title>
  <meta name="description" content="Nunua vitabu, zana za masomo, na bidhaa za elimu kwenye Duka la Lupanulla.">
  <meta name="theme-color" content="#0891b2">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
  <link rel="icon" type="image/jpg" href="images/logo.jpg">
  <link rel="apple-touch-icon" href="images/logo.jpg">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="js/sw-register.js" defer></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter','sans-serif'], display: ['Oswald','sans-serif'] },
          colors: {
            bgDark: '#f8fafc', panelLight: '#ffffff', textMain: '#0f172a',
            textMuted: '#64748b', primaryBlue: '#020617',
            accentTeal: '#0891b2', accentRed: '#e11d48'
          }
        }
      }
    }
  </script>
  <style>
    body { background-color:#f8fafc; color:#0f172a; }
    .product-card { transition: box-shadow .2s, transform .2s; }
    .product-card:hover { box-shadow: 0 8px 24px rgba(8,145,178,.12); transform: translateY(-2px); }
    .btn-cart { transition: background .15s, transform .1s; }
    .btn-cart:active { transform: scale(.96); }
    .badge { animation: pop .2s ease; }
    @keyframes pop { 0%{transform:scale(1.4)} 100%{transform:scale(1)} }
    .skeleton { background: linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%); background-size:200% 100%; animation: shimmer 1.2s infinite; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  </style>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="css/main.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body class="font-sans">

<!-- Navbar -->
<nav class="bg-primaryBlue text-white sticky top-0 z-50 shadow-md">
  <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2">
      <img src="images/logo.jpg" alt="Lupanulla" class="w-8 h-8 rounded-lg object-cover">
      <span class="font-display font-bold text-xl tracking-tight uppercase">Lupanulla</span>
    </a>

    <!-- Search -->
    <div class="hidden md:flex flex-1 max-w-md mx-6">
      <div class="relative w-full">
        <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input id="searchInput" type="text" placeholder="Tafuta bidhaa..."
          class="w-full pl-9 pr-4 py-2 bg-white/10 border border-white/20 rounded-lg text-sm text-white placeholder-slate-400 focus:outline-none focus:border-accentTeal focus:bg-white/15">
      </div>
    </div>

    <!-- Cart -->
    <a href="cart.html" class="relative flex items-center gap-1 bg-accentTeal hover:bg-cyan-600 px-4 py-2 rounded-lg text-sm font-medium transition-colors">
      <i class="ph-bold ph-shopping-cart text-lg"></i>
      <span class="hidden sm:inline">Mkoba</span>
      <span id="cartCount" class="absolute -top-1.5 -right-1.5 bg-accentRed text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
    </a>
  </div>
</nav>

<!-- Hero -->
<div class="bg-primaryBlue text-white py-10 px-4">
  <div class="max-w-6xl mx-auto">
    <p class="text-accentTeal text-sm font-medium mb-1 font-display tracking-widest uppercase">Duka la Lupanulla</p>
    <h1 class="font-display font-bold text-3xl md:text-4xl uppercase">Bidhaa za Elimu</h1>
    <p class="text-slate-400 mt-2 text-sm">Vitabu, zana, na nyenzo za masomo kwa bei nafuu</p>
  </div>
</div>

<!-- Filters -->
<div class="max-w-6xl mx-auto px-4 py-4 flex items-center gap-3 overflow-x-auto hide-scrollbar">
  <button onclick="filterCategory('')" data-cat="" class="cat-btn bg-accentTeal text-white px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap">Zote</button>
  <button onclick="filterCategory('vitabu')" data-cat="vitabu" class="cat-btn bg-white border border-gray-200 text-textMuted hover:border-accentTeal px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap">Vitabu</button>
  <button onclick="filterCategory('zana')" data-cat="zana" class="cat-btn bg-white border border-gray-200 text-textMuted hover:border-accentTeal px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap">Zana</button>
  <button onclick="filterCategory('mavazi')" data-cat="mavazi" class="cat-btn bg-white border border-gray-200 text-textMuted hover:border-accentTeal px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap">Mavazi</button>
  <button onclick="filterCategory('nyingine')" data-cat="nyingine" class="cat-btn bg-white border border-gray-200 text-textMuted hover:border-accentTeal px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap">Nyingine</button>
</div>

<!-- Products Grid -->
<main class="max-w-6xl mx-auto px-4 pb-16">
  <div id="productsGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4"></div>
  <div id="emptyState" class="hidden text-center py-20">
    <i class="ph ph-package text-5xl text-slate-300 mb-3 block"></i>
    <p class="text-textMuted">Hakuna bidhaa zilizopatikana</p>
  </div>
  <div id="loadingState" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
    <div class="skeleton h-64 rounded-xl"></div>
    <div class="skeleton h-64 rounded-xl"></div>
    <div class="skeleton h-64 rounded-xl"></div>
    <div class="skeleton h-64 rounded-xl"></div>
  </div>
</main>

<!-- Toast -->
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-primaryBlue text-white text-sm px-5 py-3 rounded-xl shadow-xl flex items-center gap-2 opacity-0 pointer-events-none transition-opacity duration-200 z-50">
  <i class="ph-bold ph-check-circle text-accentTeal"></i>
  <span id="toastMsg"></span>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBRFJ_T4qynTutOmMb_wcuuRmFIiwJ__xE",
    authDomain: "lupanulla.firebaseapp.com",
    databaseURL: "https://lupanulla-default-rtdb.firebaseio.com",
    projectId: "lupanulla",
    storageBucket: "lupanulla.firebasestorage.app",
    messagingSenderId: "168472987630",
    appId: "1:168472987630:web:8b2e4aa3bc8fb4a0f3b0ff",
    measurementId: "G-3CS888WRWH"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  // ── Cart (localStorage) ─────────────────────────────────────────────────────
  function getCart() {
    try { return JSON.parse(localStorage.getItem('lupa_cart') || '{}'); }
    catch { return {}; }
  }
  function saveCart(cart) {
    localStorage.setItem('lupa_cart', JSON.stringify(cart));
  }
  function addToCart(product) {
    const cart = getCart();
    const id   = product.id;
    if (cart[id]) {
      cart[id].quantity = Math.min(cart[id].quantity + 1, product.stockQuantity);
    } else {
      cart[id] = { id, name: product.name, price: product.price,
                   imageUrl: product.imageUrl || '', quantity: 1,
                   stockQuantity: product.stockQuantity };
    }
    saveCart(cart);
    updateCartBadge();
    showToast(`"${product.name}" imeongezwa mkobani`);
  }
  function updateCartBadge() {
    const cart  = getCart();
    const total = Object.values(cart).reduce((s, i) => s + i.quantity, 0);
    const badge = document.getElementById('cartCount');
    badge.textContent = total;
    badge.classList.toggle('hidden', total === 0);
    badge.classList.add('badge');
    setTimeout(() => badge.classList.remove('badge'), 200);
  }

  // ── Toast ───────────────────────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.style.opacity = '1';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.style.opacity = '0'; }, 2500);
  }

  // ── Render ──────────────────────────────────────────────────────────────────
  let allProducts = [];
  let activeCategory = '';

  function renderProducts(products) {
    const grid  = document.getElementById('productsGrid');
    const empty = document.getElementById('emptyState');
    grid.innerHTML = '';
    if (!products.length) { empty.classList.remove('hidden'); return; }
    empty.classList.add('hidden');
    products.forEach(p => {
      const card = document.createElement('div');
      card.className = 'product-card bg-white rounded-xl overflow-hidden border border-gray-100 flex flex-col';
      const outOfStock = p.stockQuantity <= 0;
      card.innerHTML = `
        <div class="aspect-square bg-gray-50 overflow-hidden">
          ${p.imageUrl
            ? `<img src="${p.imageUrl}" alt="${p.name}" class="w-full h-full object-cover" loading="lazy">`
            : `<div class="w-full h-full flex items-center justify-center"><i class="ph ph-package text-4xl text-slate-300"></i></div>`}
        </div>
        <div class="p-3 flex flex-col flex-1">
          <p class="text-xs text-accentTeal font-medium mb-1">${p.category || 'Bidhaa'}</p>
          <h3 class="font-medium text-sm text-textMain leading-snug mb-1 flex-1">${p.name}</h3>
          ${p.description ? `<p class="text-xs text-textMuted mb-2 line-clamp-2">${p.description}</p>` : ''}
          <div class="flex items-center justify-between mt-auto pt-2 border-t border-gray-50">
            <p class="font-display font-bold text-base text-primaryBlue">TZS ${Number(p.price).toLocaleString()}</p>
            <span class="text-xs text-textMuted">${p.stockQuantity} zilizobaki</span>
          </div>
          <button onclick='handleAddToCart(${JSON.stringify(p)})'
            class="btn-cart mt-2 w-full py-2 rounded-lg text-sm font-medium flex items-center justify-center gap-1
              ${outOfStock ? 'bg-gray-100 text-textMuted cursor-not-allowed' : 'bg-accentTeal text-white hover:bg-cyan-600'}"
            ${outOfStock ? 'disabled' : ''}>
            <i class="ph-bold ph-shopping-cart-simple"></i>
            ${outOfStock ? 'Imeisha' : 'Ongeza Mkobani'}
          </button>
        </div>`;
      grid.appendChild(card);
    });
  }

  window.handleAddToCart = function(product) { addToCart(product); };

  window.filterCategory = function(cat) {
    activeCategory = cat;
    document.querySelectorAll('.cat-btn').forEach(b => {
      const isActive = b.dataset.cat === cat;
      b.className = 'cat-btn ' + (isActive
        ? 'bg-accentTeal text-white px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap'
        : 'bg-white border border-gray-200 text-textMuted hover:border-accentTeal px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap');
    });
    const filtered = cat ? allProducts.filter(p => (p.category||'').toLowerCase() === cat) : allProducts;
    renderProducts(filtered);
  };

  // Search
  document.getElementById('searchInput').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    const filtered = allProducts.filter(p =>
      p.name.toLowerCase().includes(q) || (p.description||'').toLowerCase().includes(q)
    ).filter(p => !activeCategory || (p.category||'').toLowerCase() === activeCategory);
    renderProducts(filtered);
  });

  // ── Load from Firebase ──────────────────────────────────────────────────────
  onValue(ref(db, 'products'), snap => {
    document.getElementById('loadingState').remove();
    const data = snap.val() || {};
    allProducts = Object.entries(data).map(([id, p]) => ({ id, ...p }));
    renderProducts(allProducts);
  }, err => {
    console.error(err);
    document.getElementById('loadingState').innerHTML =
      '<p class="col-span-4 text-center py-10 text-red-500">Tatizo la kupakua bidhaa. Jaribu tena.</p>';
  });

  updateCartBadge();
</script>
</body>
</html>
