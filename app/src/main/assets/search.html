<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupanulla | Tafuta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Oswald', 'sans-serif'] },
                    colors: { bgDark: '#f8fafc', panelLight: '#ffffff', textMain: '#0f172a', primaryBlue: '#020617', accentTeal: '#0891b2' }
                }
            }
        }
    </script>
</head>
<body class="bg-bgDark font-sans antialiased">
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50 h-20 flex items-center">
        <div class="max-w-7xl mx-auto px-4 w-full flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2">
                <img src="/assets/images/logo.webp" alt="" class="w-10 h-10 rounded-lg">
                <span class="font-display font-bold text-2xl text-primaryBlue uppercase">Lupanulla</span>
            </a>
            <div class="flex-grow max-w-xl mx-8 relative">
                <input type="text" id="search-input" placeholder="Tafuta masomo, mitihani, habari..." class="w-full bg-gray-100 border-none rounded-full py-3 px-12 focus:ring-2 focus:ring-accentTeal outline-none">
                <i class="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-xl"></i>
            </div>
            <a href="index.html" class="text-gray-500 hover:text-primaryBlue"><i class="ph ph-x text-2xl"></i></a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-12">
        <div id="search-results-info" class="mb-8">
            <h1 class="text-2xl font-bold text-primaryBlue">Matokeo ya Utafutaji</h1>
            <p class="text-gray-500 mt-1">Anza kuandika hapo juu ili kupata matokeo.</p>
        </div>

        <div id="results-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Dynamic results will appear here -->
             <div class="bg-white p-6 rounded-2xl border border-gray-100 flex items-center gap-4 animate-pulse">
                <div class="w-16 h-16 bg-gray-100 rounded-xl"></div>
                <div class="flex-grow">
                    <div class="h-4 bg-gray-100 rounded w-3/4 mb-2"></div>
                    <div class="h-3 bg-gray-100 rounded w-1/2"></div>
                </div>
             </div>
        </div>
    </main>

    <script>
        const searchInput = document.getElementById('search-input');
        const resultsContainer = document.getElementById('results-container');
        const resultsInfo = document.getElementById('search-results-info');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            if (query.length > 2) {
                // Mock search logic
                resultsInfo.innerHTML = `<h1 class="text-2xl font-bold text-primaryBlue">Matokeo ya "${query}"</h1><p class="text-gray-500 mt-1">Tulipata matokeo 3 yanayohusiana.</p>`;
                resultsContainer.innerHTML = `
                    <a href="masomo.html" class="bg-white p-6 rounded-2xl border border-gray-100 flex items-center gap-4 hover:border-accentTeal transition-all shadow-sm">
                        <div class="w-16 h-16 bg-blue-100 rounded-xl flex items-center justify-center text-blue-600"><i class="ph-fill ph-book-open text-2xl"></i></div>
                        <div>
                            <h3 class="font-bold text-primaryBlue">Somolojia ya Baiolojia</h3>
                            <p class="text-sm text-gray-500">Mtaala wa Kidato cha Kwanza</p>
                        </div>
                    </a>
                    <a href="mitihani.html" class="bg-white p-6 rounded-2xl border border-gray-100 flex items-center gap-4 hover:border-accentTeal transition-all shadow-sm">
                        <div class="w-16 h-16 bg-red-100 rounded-xl flex items-center justify-center text-red-600"><i class="ph-fill ph-file-pdf text-2xl"></i></div>
                        <div>
                            <h3 class="font-bold text-primaryBlue">NECTA 2023 - Hisabati</h3>
                            <p class="text-sm text-gray-500">Past Papers</p>
                        </div>
                    </a>
                `;
            } else {
                resultsInfo.innerHTML = `<h1 class="text-2xl font-bold text-primaryBlue">Matokeo ya Utafutaji</h1><p class="text-gray-500 mt-1">Anza kuandika hapo juu ili kupata matokeo.</p>`;
                resultsContainer.innerHTML = '';
            }
        });
    </script>
</body>
</html>
